<header class="site-header">
  <div class="site-container site-header__inner">
    <a routerLink="/" class="site-brand">
      <img src="/images/Logonew.png" class="site-brand__logo" alt="NAVI Logo" />
      <div class="site-brand__text">NAVI • Định hướng nghề nghiệp</div>
    </a>

    <nav class="site-nav">

      <a routerLink="/majors" routerLinkActive="active">Các ngành nghề</a>

      <a routerLink="/mbti-test" routerLinkActive="active">Trắc nghiệm</a>

      <!-- chỉ hiện khi login -->

      <a routerLink="/courses" routerLinkActive="active" class="site-nav__lock-link">
        <span>Khóa học</span>
        <span class="site-nav__lock" *ngIf="!hasPremiumCourseAccess()" aria-label="Đã khóa" title="Chỉ mở cho gói nâng cao 99k">
          🔒
        </span>
      </a>
      
      <a routerLink="/admissions" routerLinkActive="active" class="site-nav__badge-link">
        Tuyển sinh
        <span class="site-badge-hot">HOT</span>
      </a>

      <a routerLink="/about" routerLinkActive="active">Về chúng tôi</a>

    </nav>

    <div class="site-header__actions">

      <ng-container *ngIf="!isLoggedIn(); else loggedInBlock">
        <a routerLink="/login" class="site-btn-login">Đăng nhập</a>
      </ng-container>

      <ng-template #loggedInBlock>

        <div class="site-user-menu" (mouseenter)="openUserMenu()" (mouseleave)="scheduleCloseUserMenu()">

          <button type="button" class="site-user-trigger" (click)="toggleUserMenu()">

            <span class="site-user-avatar">
              <ng-container *ngIf="avatarUrl(); else avatarLetter">
                <img
                  class="site-user-avatar__image"
                  [src]="avatarUrl()"
                  [alt]="user()?.name"
                />
              </ng-container>

              <ng-template #avatarLetter>
                <span class="site-user-avatar__inner">
                  {{ userInitial() }}
                </span>
              </ng-template>
            </span>

            <span class="site-user-meta">
              <span class="site-user-label">Tài khoản</span>
              <span class="site-user-name">{{ user()?.name }}</span>
            </span>

            <span class="site-user-caret" [class.open]="showUserMenu">
              <svg viewBox="0 0 24 24">
                <path d="M7 10l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
                  stroke-linejoin="round" />
              </svg>
            </span>

          </button>

          <div class="site-user-dropdown" *ngIf="showUserMenu">

            <!-- hồ sơ -->
            <a routerLink="/me" class="site-dropdown-item" (click)="closeUserMenu()">

              <span class="site-dropdown-icon profile">
                <svg viewBox="0 0 24 24">
                  <path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4Zm0 2c-4.42 0-8 2.24-8 5v1h16v-1c0-2.76-3.58-5-8-5Z"
                    fill="currentColor" />
                </svg>
              </span>

              <span class="site-dropdown-text">
                <strong>Hồ sơ của tôi</strong>
                <small>Xem thông tin tài khoản</small>
              </span>

            </a>

            <a routerLink="/me" [queryParams]="{ tab: 'history' }" class="site-dropdown-item" (click)="closeUserMenu()">
              <span class="site-dropdown-icon profile">
                <svg viewBox="0 0 24 24">
                  <path d="M5 3h14v18H5zM8 7h8M8 11h8M8 15h5" fill="none" stroke="currentColor" stroke-width="2" />
                </svg>
              </span>

              <span class="site-dropdown-text">
                <strong>Lịch sử test</strong>
                <small>Xem câu hỏi và kết quả đã làm</small>
              </span>
            </a>

            <a routerLink="/me" [queryParams]="{ tab: 'lessons' }" class="site-dropdown-item" (click)="closeUserMenu()">
              <span class="site-dropdown-icon profile">
                <svg viewBox="0 0 24 24">
                  <path d="M4 4h16v4H4zM4 10h16v10H4z" fill="none" stroke="currentColor" stroke-width="2" />
                </svg>
              </span>

              <span class="site-dropdown-text">
                <strong>Lịch sử bài học</strong>
                <small>Xem các bài học đã làm</small>
              </span>
            </a>

            <!-- logout -->
            <button type="button" class="site-dropdown-item site-dropdown-logout" (click)="logout()">

              <span class="site-dropdown-icon logout">
                <svg viewBox="0 0 24 24">
                  <path d="M10 17l1.41-1.41L8.83 13H20v-2H8.83l2.58-2.59L10 7l-5 5 5 5Z" fill="currentColor" />
                </svg>
              </span>

              <span class="site-dropdown-text">
                <strong>Đăng xuất</strong>
                <small>Thoát khỏi tài khoản</small>
              </span>

            </button>

          </div>

        </div>

      </ng-template>

    </div>
  </div>
</header>
