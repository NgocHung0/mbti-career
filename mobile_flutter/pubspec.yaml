name: mobile_flutter
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.0
  google_fonts: ^8.1.0
  http: ^1.6.0
  video_player: ^2.10.1
  shared_preferences: ^2.5.5
  image_picker: ^1.2.2
  url_launcher: ^6.3.2
  qr_flutter: ^4.1.0
  youtube_player_flutter: ^9.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/videos/quangcao1.mp4
    - assets/logo/
    - assets/images/
    - assets/icons/
    - assets/images/emoji2/

flutter_launcher_icons:
  android: true
  ios: false

  image_path: "assets/logo/Logonew.png"

  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo/Logonew.png"
